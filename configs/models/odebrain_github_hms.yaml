model:
  name: odebrain_inspired_hms
  kwargs:
    node_features: 5
    num_nodes: 19
    hidden_dim: 64
    raw_dim: 36
    num_classes: 6
    rk4_step_seconds: 0.25
    architecture: github_trajectory_v2
training:
  epochs: 30
  batch_size: 32
  lr: 0.001
  weight_decay: 0.01
  classification_weight: 1.0
  forecast_weight: 0.0
  patience: 8
  grad_clip: 1.0
data:
  manifest: data/curated/split_manifest.csv
  graph_cache_dir: data/training/graph_classification
  forecast_cut_seconds: 5
  forecast_horizons: [1, 3, 5]
